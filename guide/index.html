<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get started with Suhina, the free open-source DAW: choose an audio output, check what is playing and set up your project folder.">
  <title>Suhina guide: audio setup and your first sound</title>
  <!-- Apply a saved theme before the first paint, so a chosen theme never flashes the other one. -->
  <script>try{var t=localStorage.getItem('suhina-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/suhina-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Host+Grotesk:wght@400;600&display=swap">
</head>

  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
