<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suhina is a free, open-source DAW for Windows, macOS and Linux with an interface you theme in CSS. Clip launching, an arrangement timeline, a sample map, CLAP and VST3 plug-ins. Pre-alpha.">
  <title>Suhina: the open-source DAW you can restyle with CSS</title>
  <!-- Apply a saved theme before the first paint, so a chosen theme never flashes the other one. -->
  <script>try{var t=localStorage.getItem('suhina-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/suhina-mark.svg">
  <link rel="preload" as="image" href="/assets/product/suhina-session.png" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Host+Grotesk:wght@400;600&display=swap">
</head>
<body>
  <div id="app"></div>
  <noscript>Suhina is a free, open-source DAW for Windows, macOS and Linux, currently in pre-alpha. This website needs JavaScript. Find downloads and source code on <a href="https://github.com/suhina-daw/suhina-daw">GitHub</a>.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
