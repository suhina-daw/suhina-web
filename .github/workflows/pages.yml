name: Verify and publish website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_reviewed_site:
        description: Publish the current main revision after reviewing its guide content
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_reviewed_site))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish build
        id: deployment
        uses: actions/deploy-pages@v4
