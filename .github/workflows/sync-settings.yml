name: Follow DAW main settings

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      retry_publish:
        description: Rebuild and retry publishing even when settings are unchanged
        type: boolean
        required: true
        default: false

concurrency:
  group: native-main-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read only the official DAW main branch
        uses: actions/checkout@v4
        with:
          repository: suhina-daw/suhina-daw
          ref: main
          path: .native-source
          persist-credentials: false
          sparse-checkout: docs/guide-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Import committed source-approved data without executing native code
        run: node --experimental-strip-types scripts/import-main-settings.ts .native-source
      - id: changes
        run: |
          if test -z "$(git status --porcelain -- public/settings.json public/settings-source.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm ci
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm test
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm run build
      - name: Record the validated source update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/settings.json public/settings-source.json
          git commit -m 'Sync settings from approved DAW main export'
          git push origin HEAD:main
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: sync
    if: (needs.sync.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)) && vars.PAGES_SYNC_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
